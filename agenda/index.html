<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OREX Agenda</title>
<meta name="description" content="O que aconteceu na obra e o que está marcado." />
<meta name="theme-color" content="#0F0F0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Agenda" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="../app/apple-touch-icon.png" />
<link rel="icon" href="../app/icone-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" />
<link rel="stylesheet" href="../app/comum.css" />

<!--
  /agenda — o que aconteceu e o que está marcado, na mesma linha de tempo.
  A parte do passado é uma VISTA sobre o que já se regista noutros sítios; só
  as marcações são dados próprios.

  Ao contrário das outras páginas, esta precisa de rede para ler: o que mostra
  vive na base, não no telemóvel. Sem rede diz-o, em vez de aparecer vazia.
-->

<style>
  .dia{margin:18px 0 8px;font-family:"Archivo",sans-serif;font-weight:800;font-size:13px;
       letter-spacing:.02em;color:var(--ink-2);position:sticky;top:0;background:var(--paper);
       padding:6px 0;border-bottom:1px solid var(--line-2);z-index:2;}
  .dia.hoje{color:var(--erro);}
  .ev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);align-items:flex-start;}
  .ev .hora{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--steel);
            width:44px;flex:none;padding-top:2px;}
  .ev .ic{font-size:17px;width:24px;flex:none;text-align:center;}
  .ev .txt{flex:1;min-width:0;}
  .ev .txt b{font-size:13.5px;font-weight:600;display:block;}
  .ev .txt small{color:var(--steel);font-size:11.5px;}
  .ev.futuro{background:rgba(138,97,0,0.05);border-radius:6px;padding-left:6px;padding-right:6px;}
  .filtros{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .filtros button{flex:none;width:auto;padding:5px 12px;font-size:12.5px;
                  background:transparent;color:var(--steel);border:1px solid var(--line);}
  .filtros button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  /* As duas caras do mesmo objecto — prazo ou hora — coladas uma a` outra, para
     se lerem como UMA pergunta com duas respostas e nao como dois botoes. */
  .duplo{display:flex;}
  .duplo button{flex:1;width:auto;padding:7px 10px;font-size:13px;
                background:transparent;color:var(--steel);border:1px solid var(--line);}
  .duplo button:first-child{border-radius:8px 0 0 8px;border-right:none;}
  .duplo button:last-child{border-radius:0 8px 8px 0;}
  .duplo button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
</style>

<header>
  <div class="marca">OREX</div>
  <div style="font-size:13px;color:#9A9A90;">agenda</div>
  <div class="quem" id="quem"></div>
</header>

<main id="ecra"></main>
<div class="barra" id="barra" hidden></div>

<script src="../app/orex.js?v=2"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

const ICONES = { marcacao:"🗓", media:"📷", documento:"📄", comunicacao:"✉️", submissao:"📋", auto:"📐" };
const ICONE_TIPO = { visita:"👷", entrega:"🚚", betonagem:"🧱", reuniao:"💬", inspeccao:"🔍", prazo:"⏰", outro:"🗓" };
const DIAS = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

let linhas = null, filtro = "", obraSel = "", dias = 30, recado = null, erroRede = null, novaAberta = false;
function aviso(t, tipo = "nota") { recado = t ? { txt:t, tipo } : null; pintar(); }
const todasAsObras = () =>
  OREX.empresas().flatMap(e => (e.obras || []).map(o => ({ ...o, ownerId: e.ownerId, emp: e.nome })));
// OS MESMOS CAMPOS QUE NO COMPUTADOR, e não é um capricho de coerência.
//
//   Esta página ficou parada no modelo antigo: perguntava um «Tipo» — visita,
//   betonagem, prazo — que MISTURAVA DOIS EIXOS numa pergunta só. «Prazo» é a
//   forma de uma coisa; «betonagem» é a espécie dela. Postos lado a lado no
//   mesmo menu, obrigavam a escolher entre duas perguntas diferentes.
//
//   No computador isso já foi separado: pergunta-se DE QUÊ (o âmbito) e, quando
//   faz sentido, O QUE É (a espécie). O `Tipo` da base deriva das duas.
//
//   Enquanto o telemóvel escrevia à maneira antiga, o que entrava por aqui não
//   tinha âmbito nenhum — caía todo no mesmo saco e não aparecia onde devia.
const AMBITOS = [
  ["pessoal",     "🔒 Pessoal (só eu vejo)"],
  ["geral",       "Geral"],
  ["obra",        "Obra"],
  ["compras",     "Compras"],
  ["seguranca",   "Segurança"],
  ["qualidade",   "Qualidade"],
  ["equipamento", "Equipamento"],
  ["rh",          "Pessoal da empresa"],
  ["financeiro",  "Financeiro"],
  ["comercial",   "Comercial"],
  ["interna",     "Interna"],
];

// Só aparece onde faz sentido: uma betonagem numa questão de recursos humanos
// não é nada. E é opcional — a maioria do que se marca não é nenhuma destas.
const ESPECIES_OBRA = [
  ["", "—"], ["visita", "visita"], ["entrega", "entrega"], ["betonagem", "betonagem"],
  ["reuniao", "reunião"], ["inspeccao", "inspecção"],
];

// Um dia para o <input type="date">.
const paraDia = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

// As duas caras do mesmo objecto: uma coisa tem PRAZO (até um dia) ou HORA
// (começa a uma hora), nunca as duas — é o que a base exige desde a 188.
let comHora = false;
let ambitoSel = "geral";

// Uma data em hora local para o <input datetime-local>, que não aceita ISO com Z.
const paraCaixa = (d) => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);

const chaveDia = (d) => new Date(d).toISOString().slice(0, 10);
function rotuloDia(iso) {
  const d = new Date(iso + "T12:00:00");
  const hoje = new Date().toISOString().slice(0, 10);
  const amanha = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
  const base = `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`;
  return iso === hoje ? `hoje · ${base}` : iso === amanha ? `amanhã · ${base}` : base;
}

// A agenda vem do Supabase, não do OREX. É a mesma razão das outras páginas:
// o servidor do OREX corre no computador de alguém e pode não estar ligado —
// e quem abre isto está em obra, do lado de fora da rede da empresa.
//
// A vista precisa de juntas que o PostgREST não faz, por isso está numa função
// (mov_agenda, migração 151), que devolve só o que este aparelho pode ver.
async function carregar() {
  erroRede = null;
  try {
    const c = OREX.cred(), tok = await OREX.autenticar();
    const res = await fetch(`${c.url}/rest/v1/rpc/mov_agenda`, {
      method: "POST",
      headers: { apikey: c.chave, Authorization: `Bearer ${tok}`, "Content-Type": "application/json" },
      body: JSON.stringify({ p_obra: obraSel ? +obraSel : null, p_dias: dias }),
    });
    if (!res.ok) throw new Error(`o servidor respondeu ${res.status}`);
    linhas = (await res.json()) || [];
  } catch (e) {
    erroRede = e.message; linhas = [];
  }
  pintar();
}

// ── AVISOS ─────────────────────────────────────────────────────────────────
//
//   Quem decide os avisos é a base (pg_cron, migração 190). Aqui só se trata de
//   este aparelho dizer «avisem-me» e ficar com um endereço para onde o serviço
//   de push possa entregar.
//
//   NO IPHONE ISTO SÓ FUNCIONA COM A PÁGINA ADICIONADA AO ECRÃ PRINCIPAL —
//   desde o iOS 16.4, e não antes. Diz-se, em vez de deixar a pessoa carregar
//   num botão que não faz nada. E é a mesma condição que faz o Safari não
//   apagar as credenciais ao fim de 7 dias, portanto vale a pena de qualquer
//   maneira.
const rpc = async (nome, corpo) => {
  const c = OREX.cred(), tok = await OREX.autenticar();
  const r = await fetch(`${c.url}/rest/v1/rpc/${nome}`, {
    method: "POST",
    headers: { apikey: c.chave, Authorization: `Bearer ${tok}`, "Content-Type": "application/json" },
    body: JSON.stringify(corpo || {}),
  });
  if (!r.ok) throw new Error(`o servidor respondeu ${r.status}`);
  return r.json();
};

const naTela = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const ehIPhone = () => /iPad|iPhone|iPod/.test(navigator.userAgent);

function estadoAvisos() {
  if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window))
    return { pode: false, porque: "Este browser não sabe receber avisos." };
  if (ehIPhone() && !naTela())
    return { pode: false, porque: "No iPhone, os avisos só funcionam com esta página adicionada ao ecrã principal (Partilhar → Adicionar ao ecrã principal)." };
  if (Notification.permission === "denied")
    return { pode: false, porque: "Os avisos estão bloqueados nas definições do browser para este site." };
  return { pode: true, ligado: Notification.permission === "granted" };
}

// A chave pública vem em base64url e o browser quer bytes. Sem esta conversão
// o `subscribe` rejeita com uma mensagem que não ajuda ninguém.
function chaveEmBytes(b64) {
  const p = "=".repeat((4 - (b64.length % 4)) % 4);
  const b = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...b].map((ch) => ch.charCodeAt(0)));
}

async function ligarAvisos() {
  const e = estadoAvisos();
  if (!e.pode) { aviso(e.porque, "erro"); return; }
  try {
    if ((await Notification.requestPermission()) !== "granted") {
      aviso("Sem autorização, não há avisos.", "erro"); return;
    }
    const reg = await navigator.serviceWorker.ready;
    const chave = await rpc("age_vapid_publica");
    if (!chave) throw new Error("esta base ainda não tem chaves de aviso");
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,                       // o browser exige-o, e é justo
      applicationServerKey: chaveEmBytes(chave),
    });
    const j = sub.toJSON();
    const r = await rpc("mov_subscrever_avisos", {
      p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth,
      p_aparelho: navigator.userAgent.slice(0, 80), p_plataforma: ehIPhone() ? "iphone" : "android",
    });
    if (!r || r.ok !== true) throw new Error((r && r.erro) || "não consegui registar");
    aviso("Avisos ligados neste aparelho.", "ok");
  } catch (err) {
    aviso("Não consegui ligar os avisos: " + err.message, "erro");
  }
  pintar();
}

async function desligarAvisos() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    await rpc("mov_desligar_avisos", { p_endpoint: sub ? sub.endpoint : null });
    if (sub) await sub.unsubscribe();
    aviso("Este aparelho deixa de receber avisos.", "ok");
  } catch (err) { aviso("Não consegui desligar: " + err.message, "erro"); }
  pintar();
}

// ── O LEMBRETE COM UM TOQUE ────────────────────────────────────────────────
//
//   A notificação trouxe um botão «Ligar»; o service worker abriu esta página
//   com `?ligar=+351…`. O que falta é o gesto: mandar o telemóvel para o
//   marcador com o número já escrito.
//
//   O `tel:` tem de partir DAQUI e não do service worker — o `openWindow` de um
//   service worker só aceita endereços do mesmo sítio, e recusa um `tel:` sem
//   dizer porquê.
//
//   E limpa-se o endereço a seguir: sem isso, recarregar a página volta a
//   marcar o número, e uma pessoa que recarregue duas vezes liga duas vezes.
async function talvezLigar() {
  const u = new URL(location.href);
  const numero = u.searchParams.get("ligar");
  const assunto = u.searchParams.get("assunto");
  if (!numero) return;

  u.searchParams.delete("ligar");
  history.replaceState(null, "", u.pathname + (u.search === "?" ? "" : u.search));

  // Fica escrito no fio que se ligou. Não é o registo da chamada — é o registo
  // de que ela foi iniciada, que é o que este programa pode honestamente saber:
  // o browser não faz ideia se a chamada foi atendida.
  //   PELA FILA, e não por uma chamada directa. Quem liga a partir de um aviso
  //   está muitas vezes numa obra sem rede — e é aí que o registo se perderia,
  //   que é justamente quando ele faz mais falta. Na fila, sai quando houver.
  if (assunto) {
    try { await OREX.comentar(assunto, "Ligou para " + numero, "chamada"); }
    catch { /* nem a fila deu: a chamada faz-se na mesma */ }
  }
  location.href = "tel:" + numero.replace(/\s+/g, "");
}

function pintar() {
  const c = OREX.cred();
  $("#quem").innerHTML = c ? `${esc(c.utilizador || "")}<br>${esc(c.nome || "")}` : "";
  if (!c) { $("#barra").hidden = true; return semCredencial(); }

  const obras = todasAsObras();
  const agora = Date.now();
  const vis = (linhas || []).filter(l => !filtro || l.fonte === filtro);
  const porDia = new Map();
  for (const l of vis) {
    const k = chaveDia(l.quando);
    if (!porDia.has(k)) porDia.set(k, []);
    porDia.get(k).push(l);
  }
  const dias = [...porDia.keys()].sort().reverse();
  const hoje = new Date().toISOString().slice(0, 10);

  $("#ecra").innerHTML = `
    ${recado ? `<div class="aviso ${recado.tipo}">${esc(recado.txt)}</div>` : ""}
    ${erroRede ? `<div class="aviso erro">Não consegui ler a agenda: ${esc(erroRede)}.<br>
       <small>Esta página precisa de rede — o que mostra vive na base, não no telemóvel.</small></div>` : ""}

    ${novaAberta ? `<div class="cartao" style="margin-bottom:14px;">
      <div class="campo"><label for="mTitulo">O que se marca</label>
        <input id="mTitulo" type="text" placeholder="Betonagem da laje do piso 1" autocomplete="off" /></div>
      <div class="campo"><label>Quando</label>
        <div class="duplo">
          <button type="button" data-q="prazo" class="${comHora ? "" : "on"}">até uma data</button>
          <button type="button" data-q="hora"  class="${comHora ? "on" : ""}">a uma hora</button>
        </div></div>
      <div class="campo">${comHora
        ? `<label for="mQuando">Dia e hora</label>
           <input id="mQuando" type="datetime-local" value="${paraCaixa(new Date(agora + 864e5))}" />`
        : `<label for="mPrazo">Até</label>
           <input id="mPrazo" type="date" value="${paraDia(new Date(agora + 864e5))}" />`}</div>
      <div class="campo"><label for="mAmbito">De quê</label>
        <select id="mAmbito">${AMBITOS.map(([v, t]) =>
          `<option value="${v}" ${v === ambitoSel ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></div>
      ${ambitoSel === "obra" && comHora ? `<div class="campo"><label for="mEspecie">O que é</label>
        <select id="mEspecie">${ESPECIES_OBRA.map(([v, t]) =>
          `<option value="${v}">${esc(t)}</option>`).join("")}</select></div>` : ""}
      <div class="campo"><label for="mObra">Obra</label>
        <select id="mObra">${obras.map(o =>
          `<option value="${o.id}" ${String(o.id) === obraSel ? "selected" : ""}>${o.num ? o.num + " · " : ""}${esc(o.nome)}</option>`).join("")}</select></div>
      <div class="campo"><label for="mLocal">Onde (opcional)</label>
        <input id="mLocal" type="text" placeholder="Estaleiro" autocomplete="off" /></div>
      <button id="mGravar">Marcar</button>
      <button id="mFechar" class="secundario">Deixa estar</button>
    </div>` : ""}

    ${obras.length > 1 ? `<div class="campo">
      <select id="obra">
        <option value="">Todas as obras</option>
        ${obras.map(o => `<option value="${o.id}" ${String(o.id) === obraSel ? "selected" : ""}>${o.num ? o.num + " · " : ""}${esc(o.nome)}</option>`).join("")}
      </select></div>` : ""}

    <div class="filtros">
      ${/* Correspondência e submissões ficam de fora no telemóvel: é matéria de
            escritório e a mais sensível de todas. Quem está em obra quer ver o
            que se passou no estaleiro. */
        [["","Tudo"],["marcacao","Marcado"],["media","Fotografias"],
         ["documento","Documentos"],["auto","Autos"]].map(([k, r]) =>
        `<button data-f="${k}" class="${filtro === k ? "on" : ""}">${r}</button>`).join("")}
    </div>

    ${!dias.length
      ? `<div class="vazio">${erroRede ? "" : "Nada a mostrar neste filtro."}</div>`
      : dias.map(k => `
        <div class="dia ${k === hoje ? "hoje" : ""}">${rotuloDia(k)}</div>
        ${porDia.get(k).sort((a, b) => new Date(b.quando) - new Date(a.quando)).map(l => {
          const futuro = new Date(l.quando).getTime() > agora;
          const ic = l.fonte === "marcacao" ? (ICONE_TIPO[l.tipo] || "🗓") : (ICONES[l.fonte] || "•");
          return `<div class="ev ${futuro ? "futuro" : ""}">
            <div class="hora">${new Date(l.quando).toLocaleTimeString("pt-PT", { hour:"2-digit", minute:"2-digit" })}</div>
            <div class="ic">${ic}</div>
            <div class="txt">
              <b>${esc(l.titulo || "(sem título)")}</b>
              <small>${esc(l.tipo || l.fonte)}${l.onde ? " · " + esc(l.onde) : ""}${l.quem ? " · " + esc(l.quem) : ""}
              ${l.estado ? " · " + esc(l.estado) : ""}</small>
            </div>
          </div>`;
        }).join("")}`).join("")}

    ${dias < 365 && dias > 0 && linhas ? `<div style="text-align:center;margin-top:16px;">
      <button id="btMais" class="secundario" style="width:auto;padding:7px 18px;font-size:12.5px;">
        Ver mais atrás (${dias} dias → ${dias * 4})</button></div>` : ""}

    <div class="rodape"><a href="../app/" style="color:var(--steel);">este telemóvel</a> · orexerp.pt</div>`;

  $("#barra").hidden = false;
  // O botão dos avisos diz sempre o que se passa, mesmo quando não pode fazer
  // nada: um botão que desaparece sem explicação faz a pessoa concluir que o
  // programa não tem avisos, e é a conclusão errada.
  const av = estadoAvisos();
  const botaoAvisos = av.pode
    ? `<button id="btAvisos">${av.ligado ? "🔔 Avisos ligados" : "🔕 Receber avisos"}</button>`
    : `<button id="btPorque" class="fraco" title="${esc(av.porque)}">🔕 Avisos indisponíveis</button>`;
  $("#barra").innerHTML =
    `<button id="btNova">${novaAberta ? "✕ Fechar" : "🗓 Marcar"}</button>` + botaoAvisos;
  $("#btNova").onclick = () => { novaAberta = !novaAberta; pintar(); if (novaAberta) $("#mTitulo")?.focus(); };
  const ba = $("#btAvisos");
  if (ba) ba.onclick = () => (av.ligado ? desligarAvisos() : ligarAvisos());
  const bp = $("#btPorque");
  if (bp) bp.onclick = () => aviso(av.porque, "nota");
  if (novaAberta) {
    $("#mGravar").onclick = gravarMarcacao;
    $("#mFechar").onclick = () => { novaAberta = false; pintar(); };
    // Mudar de eixo redesenha o formulário: a caixa da data muda, e a espécie
    // aparece ou desaparece conforme o âmbito.
    document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
      comHora = b.dataset.q === "hora"; pintar();
    });
    const a = $("#mAmbito");
    if (a) a.onchange = () => { ambitoSel = a.value; pintar(); };
  }
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filtro = b.dataset.f; pintar(); });
  const so = $("#obra");
  if (so) so.onchange = () => { obraSel = so.value; carregar(); };
  const bm = $("#btMais");
  if (bm) bm.onclick = () => { dias = Math.min(dias * 4, 365); carregar(); };
}

function semCredencial() {
  $("#ecra").innerHTML = `
    <div class="cartao">
      <h2 style="font-size:20px;margin-bottom:8px;">Este telemóvel ainda não está ligado</h2>
      <a href="../app/" style="text-decoration:none;"><button style="margin-top:10px;">Ligar o telemóvel</button></a>
    </div>`;
}

// Marcar. Um formulário pequeno, e não três caixas de prompt seguidas: quem
// está em obra a marcar uma betonagem com uma mão não passa por isso.
async function gravarMarcacao() {
  const obras = todasAsObras();
  const obraId = +($("#mObra")?.value || obraSel || 0) || null;
  const emp = obras.find(o => o.id === obraId);
  const ownerId = emp ? emp.ownerId : (OREX.empresas()[0] || {}).ownerId;
  if (!ownerId) return aviso("Ainda não sei a que empresa isto pertence.", "erro");

  const titulo = ($("#mTitulo").value || "").trim();
  if (!titulo) return aviso("Falta dizer o que se marca.", "erro");

  // UM DOS DOIS, NUNCA OS DOIS — é o que a CHECK da 188 exige, e é o que
  // distingue as duas caras do mesmo objecto.
  let comeca = null, prazo = null;
  if (comHora) {
    const q = $("#mQuando")?.value;
    if (!q) return aviso("Falta o dia e a hora.", "erro");
    comeca = new Date(q).toISOString();
  } else {
    prazo = $("#mPrazo")?.value || null;
    if (!prazo) return aviso("Falta a data até quando.", "erro");
  }

  const ambito = $("#mAmbito")?.value || "geral";
  // Um assunto de obra tem de apontar a uma obra: a base recusa-o de outra
  // maneira, e mais vale dizê-lo aqui do que devolver um erro de restrição.
  if (ambito === "obra" && !obraId) return aviso("Um assunto de obra tem de dizer qual.", "erro");

  $("#mGravar").disabled = true;
  try {
    const c = OREX.cred(), tok = await OREX.autenticar();
    const r = await fetch(`${c.url}/rest/v1/Age_Marcacao`, {
      method: "POST",
      // return=minimal de propósito: o aparelho tem licença para ESCREVER uma
      // marcação, não para ler a tabela. Pedir o registo de volta dava 403.
      headers: { apikey: c.chave, Authorization: `Bearer ${tok}`,
                 "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({
        OwnerID: ownerId, ObraID: ambito === "obra" ? obraId : (obraId || null), Titulo: titulo,
        Ambito: ambito,
        // O `Tipo` da base DERIVA das duas perguntas, em vez de ser uma
        // terceira: com prazo é uma tarefa; com hora é a espécie escolhida, ou
        // «outro» quando não se escolheu nenhuma. É o mesmo que o computador faz.
        Tipo: !comHora ? "tarefa" : (($("#mEspecie")?.value) || "outro"),
        Comeca: comeca, Prazo: prazo,
        Local: ($("#mLocal").value || "").trim() || null,
      }),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(r.status === 401 || r.status === 403
        ? "Sem autorização para marcar nesta obra."
        : (d.message || `o servidor respondeu ${r.status}`));
    }
    novaAberta = false;
    aviso("Marcado.", "ok");
    carregar();
  } catch (e) {
    aviso(e.message, "erro");
    const b = $("#mGravar"); if (b) b.disabled = false;
  }
}

/* ── Arranque ─────────────────────────────────────────────────────────────── */
(async function () {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  OREX.aoMudar((que, d) => { if (que === "revogado") { recado = null; pintar(); aviso(d.porque, "erro"); } });
  pintar();
  if (OREX.cred()) { OREX.buscarDestinos().catch(() => {}); carregar(); talvezLigar(); }
})();
</script>
