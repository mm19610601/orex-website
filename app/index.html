<!--
  OREX Obra — a app de bolso.

  Uma coisa só: tirar a fotografia e ela chegar à obra certa. Tudo o que aqui
  está serve isso, e o que não servir sai.

  Três decisões que explicam o resto do ficheiro:

  1. Sem construção, sem dependências. É HTML, CSS e JavaScript à mão, servido
     pelo GitHub Pages. Um `git push` publica. Não há passo que se possa
     esquecer entre escrever isto e o telemóvel de alguém o ter.

  2. A rede é opcional. Numa cave de betão não há rede, e é lá que se tira a
     fotografia. Portanto: a fotografia entra numa fila em IndexedDB e sai de
     lá quando puder. Fechar a app não perde nada.

  3. O telefone nunca vê a chave de serviço. Emparelha-se com uma credencial
     própria daquele aparelho — e à primeira abertura troca a palavra-passe por
     outra que ninguém, nem o servidor, chegou a mostrar. A partir daí o QR
     que a criou não vale nada.
-->

<style>

  body{
    background:var(--paper); color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2{font-family:"Archivo",system-ui,sans-serif;margin:0;letter-spacing:-0.02em;line-height:1.1;}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;}

  header{
    background:var(--ink); color:var(--paper);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    display:flex; align-items:center; gap:10px; flex:none;

  header .quem{margin-left:auto;font-size:11px;color:#9A9A90;text-align:right;line-height:1.25;}

  .linha{display:flex;gap:8px;}

  .aviso{border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin-bottom:12px;}
  .aviso.erro{background:rgba(163,44,37,0.10);color:var(--erro);}
  .aviso.ok{background:rgba(31,122,72,0.12);color:var(--ok);}

  /* Botão de disparo — grande, no polegar, sempre no mesmo sítio. */
  .barra{
    position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--paper) 72%,rgba(241,240,235,0));

  .item .txt{flex:1;min-width:0;font-size:13px;}

  .estado{font-size:10.5px;font-family:"JetBrains Mono",ui-monospace,monospace;text-transform:uppercase;

  /* Ditar — o polegar sujo de obra escreve mal num teclado de vidro. */

  .vazio{text-align:center;color:var(--steel);font-size:13.5px;padding:22px 10px;}

  .abas{display:flex;gap:6px;margin-bottom:14px;}
  .abas button{flex:1;background:transparent;color:var(--steel);border:1px solid transparent;
               padding:8px;font-size:13.5px;font-weight:700;border-radius:8px;}

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════════
   Guardados no telefone
   ────────────────────────────────────────────────────────────────────────── */
const G = {
  cred:     "orex.cred",      // credencial deste aparelho (inclui a palavra-passe)
  sessao:   "orex.sessao",    // token em curso; descartável
  destinos: "orex.destinos",  // empresas e obras — para funcionar sem rede
  ultimo:   "orex.ultimo",    // última obra escolhida; poupa toques
};
const ler  = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
const grav = (k, v) => localStorage.setItem(k, JSON.stringify(v));

const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));

/* ══════════════════════════════════════════════════════════════════════════
   A fila (IndexedDB)

   O sítio onde a fotografia fica em segurança entre o disparo e a rede. É o
   coração da app: sem isto, uma fotografia tirada numa cave perdia-se.
   ────────────────────────────────────────────────────────────────────────── */
let _db = null;
function bd() {
  if (_db) return Promise.resolve(_db);
  return new Promise((ok, mal) => {
    const p = indexedDB.open("orex-obra", 1);
    p.onupgradeneeded = () => {
      const d = p.result;
      if (!d.objectStoreNames.contains("fila")) d.createObjectStore("fila", { keyPath: "idLocal" });
    };
    p.onsuccess = () => { _db = p.result; ok(_db); };
    p.onerror = () => mal(p.error);
  });
}
function trans(modo, f) {
  return bd().then(d => new Promise((ok, mal) => {
    const t = d.transaction("fila", modo), s = t.objectStore("fila");
    const r = f(s);
    t.oncomplete = () => ok(r && r.result !== undefined ? r.result : r);
    t.onerror = () => mal(t.error);
  }));
}
const filaPor   = ()   => trans("readonly",  s => s.getAll());
const filaGrav  = (it) => trans("readwrite", s => s.put(it));
const filaTira  = (id) => trans("readwrite", s => s.delete(id));

/* ══════════════════════════════════════════════════════════════════════════
   Credencial e autenticação

   O aparelho tem conta própria no Supabase. À primeira abertura troca a
   palavra-passe: a que veio no QR deixa de servir, e o retrato que alguém
   tenha feito do ecrã com ela passa a ser papel velho.

   A troca é feita em dois tempos — grava-se a nova ANTES de a pedir, como
   `passwordNova`, e só se promove depois de funcionar. Assim, se a app morrer
   a meio, a próxima abertura experimenta as duas e o telefone não fica preso
   do lado de fora.
   ────────────────────────────────────────────────────────────────────────── */
const cred = () => ler(G.cred);

async function chamarAuth(caminho, corpo) {
  const c = cred();
  const r = await fetch(`${c.url}/auth/v1/${caminho}`, {
    method: "POST",
    headers: { apikey: c.chave, "Content-Type": "application/json" },
    body: JSON.stringify(corpo),
  });
  return { ok: r.ok, d: await r.json().catch(() => ({})) };
}

async function autenticar() {
  const c = cred();
  if (!c) throw new Error("Este telemóvel ainda não está emparelhado.");

  const s = ler(G.sessao);
  if (s?.access_token && s.expira > Date.now() + 60000) return s.access_token;

  let d = null, ultimoErro = null;
  if (s?.refresh_token) {
    const r = await chamarAuth("token?grant_type=refresh_token", { refresh_token: s.refresh_token });
    if (r.ok) d = r.d;
  }
  if (!d) {
    // As duas por ordem: a nova primeiro, porque é a que deve estar em vigor.
    for (const pw of [c.passwordNova, c.password].filter(Boolean)) {
      const r = await chamarAuth("token?grant_type=password", { email: c.email, password: pw });
      if (r.ok) {
        d = r.d;
        if (pw !== c.password) { c.password = pw; delete c.passwordNova; grav(G.cred, c); }
        break;
      }
      ultimoErro = r.d;
    }
  }
  if (!d?.access_token) {
    throw new Error(ultimoErro?.error_description || ultimoErro?.msg
      || "Esta credencial já não é aceite. Provavelmente o aparelho foi revogado — pede um novo QR.");
  }
  grav(G.sessao, { ...d, expira: Date.now() + (d.expires_in || 3600) * 1000 });
  return d.access_token;
}

async function trocarPassword() {
  const c = cred();
  if (c.trocada) return;
  const nova = Array.from(crypto.getRandomValues(new Uint8Array(24)))
    .map(b => "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 55]).join("");
  c.passwordNova = nova; grav(G.cred, c);          // primeiro guardar, depois pedir

  const tok = await autenticar();
  const r = await fetch(`${c.url}/auth/v1/user`, {
    method: "PUT",
    headers: { apikey: c.chave, Authorization: `Bearer ${tok}`, "Content-Type": "application/json" },
    body: JSON.stringify({ password: nova }),
  });
  if (!r.ok) return;                                // fica para a próxima abertura
  const d = cred();
  d.password = nova; delete d.passwordNova; d.trocada = true; grav(G.cred, d);
  localStorage.removeItem(G.sessao);                // a sessão antiga já não interessa
}

/* ══════════════════════════════════════════════════════════════════════════
   Destinos — para onde este telefone pode mandar
   ────────────────────────────────────────────────────────────────────────── */
async function buscarDestinos() {
  const c = cred(), tok = await autenticar();
  const r = await fetch(`${c.url}/rest/v1/rpc/mov_destinos`, {
    method: "POST",
    headers: { apikey: c.chave, Authorization: `Bearer ${tok}`, "Content-Type": "application/json" },
    body: "{}",
  });
  if (!r.ok) throw new Error(`O servidor recusou a lista de obras (${r.status}).`);
  const d = await r.json();
  if (!d || !d.empresas) throw new Error("Este aparelho já não está activo.");
  grav(G.destinos, { ...d, em: Date.now() });
  return d;
}

/* ══════════════════════════════════════════════════════════════════════════
   Enviar

   Ficheiro primeiro, registo depois. Ao contrário ficaria uma linha a apontar
   para uma fotografia que não existe — e essa é a avaria que dá trabalho a
   perceber. Um ficheiro sem linha é só espaço ocupado.
   ────────────────────────────────────────────────────────────────────────── */
async function detalheErro(r, oQue) {
  let t = ""; try { const d = await r.json(); t = d.message || d.msg || d.error || ""; } catch {}
  if (r.status === 401 || r.status === 403)
    return `Sem autorização para enviar ${oQue}. O aparelho pode ter sido revogado.`;
  if (r.status === 413) return "A fotografia é grande demais para o servidor a aceitar.";
  return `Falhou o envio d${oQue === "a fotografia" ? "a fotografia" : "o registo"} (${r.status})${t ? ": " + t : ""}`;
}

async function enviarUm(it) {
  const c = cred();
  let tok = await autenticar();
  // Uma posição é só a linha — não há imagem para subir.
  const posicao = it.tipo === "posicao";
  const caminho = posicao ? null : `${c.aparelhoId}/${it.tiradaEm.slice(0, 7)}/${it.idLocal}.jpg`;

  if (!posicao) {
    const por = async (t) => fetch(`${c.url}/storage/v1/object/orex-movel/${caminho}`, {
      method: "POST",
      headers: { apikey: c.chave, Authorization: `Bearer ${t}`, "Content-Type": "image/jpeg", "x-upsert": "true" },
      body: it.foto,
    });
    let r1 = await por(tok);
    if (r1.status === 401) { localStorage.removeItem(G.sessao); tok = await autenticar(); r1 = await por(tok); }
    if (!r1.ok) throw new Error(await detalheErro(r1, "a fotografia"));
  }

  const r2 = await fetch(`${c.url}/rest/v1/Mov_Captura`, {
    method: "POST",
    headers: { apikey: c.chave, Authorization: `Bearer ${tok}`, "Content-Type": "application/json",
               Prefer: "return=minimal" },
    body: JSON.stringify({
      IdLocal: it.idLocal, AparelhoID: c.aparelhoId, OwnerID: it.ownerId,
      Destino: posicao ? "rtls" : "obra", RefID: it.obraId, TiradaEm: it.tiradaEm,
      Lat: it.lat ?? null, Lng: it.lng ?? null, PrecisaoM: it.precisao ?? null,
      Nota: it.nota || null, Ficheiro: caminho,
    }),
  });
  // Já lá estava: a fotografia chegou numa tentativa anterior cuja resposta se
  // perdeu. Repetir seria criar um duplicado; dar por enviada é a verdade.
  if (r2.status === 409) return;
  if (!r2.ok) throw new Error(await detalheErro(r2, "o registo"));
}

let _aEnviar = false;
async function escoarFila(porOrdem) {
  if (_aEnviar || !navigator.onLine || !cred()) return;
  _aEnviar = true;
  try {
    const itens = (await filaPor()).sort((a, b) => a.tiradaEm.localeCompare(b.tiradaEm));
    for (const it of itens) {
      if (it.estado === "enviando") continue;
      // Uma falha recente não se repete já — evita gastar bateria contra uma
      // parede. O botão "tentar agora" ignora esta espera, que é para isso.
      if (!porOrdem && it.proxima && it.proxima > Date.now()) continue;
      it.estado = "enviando"; await filaGrav(it);
      filaCache = await filaPor(); pintar();
      try {
        await enviarUm(it);
        await filaTira(it.idLocal);
        esquecerMiniatura(it.idLocal);
      } catch (e) {
        it.estado = "falhou"; it.erro = e.message;
        it.tentativas = (it.tentativas || 0) + 1;
        it.proxima = Date.now() + Math.min(10 * 60000, 15000 * 2 ** Math.min(it.tentativas, 5));
        await filaGrav(it);
      }
      filaCache = await filaPor(); pintar();
    }
  } finally { _aEnviar = false; filaCache = await filaPor(); pintar(); }
}

/* ══════════════════════════════════════════════════════════════════════════
   Fotografia

   Reduzida antes de entrar na fila. Um telemóvel actual dá 6 MB por foto; numa
   obra com meia barra de rede isso não sobe. 1600 px chegam para se ver o que
   se quis mostrar, e cabem em ~300 kB.
   ────────────────────────────────────────────────────────────────────────── */
function encolher(ficheiro, lado = 1600, q = 0.82) {
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(ficheiro);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const e = Math.min(1, lado / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * e); c.height = Math.round(img.height * e);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? ok(b) : mal(new Error("Não consegui preparar a fotografia.")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error("Não consegui ler a fotografia.")); };
    img.src = url;
  });
}

// Onde foi tirada. Best-effort: sem sinal de GPS a fotografia vai na mesma —
// perder a fotografia por causa da localização seria trocar o essencial pelo
// acessório.
function ondeEstou(ms = 8000) {
  return new Promise(ok => {
    if (!navigator.geolocation) return ok({});
    navigator.geolocation.getCurrentPosition(
      p => ok({ lat: p.coords.latitude, lng: p.coords.longitude, precisao: p.coords.accuracy }),
      () => ok({}), { enableHighAccuracy: true, timeout: ms, maximumAge: 30000 });
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   Ecrãs
   ────────────────────────────────────────────────────────────────────────── */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
let vista = "camara", filaCache = [], recado = null, leitor = null;

// As miniaturas da fila são URLs para blobs em memória. Criar um por cada
// repintura e nunca o libertar é o caminho para a app ser morta pelo sistema
// ao fim de meia hora numa obra — por isso guardam-se e devolvem-se.
const _miniaturas = new Map();
function miniatura(it) {
  if (!it.foto) return "";
  if (!_miniaturas.has(it.idLocal)) _miniaturas.set(it.idLocal, URL.createObjectURL(it.foto));
  return _miniaturas.get(it.idLocal);
}
function esquecerMiniatura(id) {
  const u = _miniaturas.get(id);
  if (u) { URL.revokeObjectURL(u); _miniaturas.delete(id); }
}

function aviso(txt, tipo = "nota") { recado = { txt, tipo }; pintar(); }

function pintar() {
  // Repintar deita fora a caixa de texto. Um ouvinte a escrever para um campo
  // que já não existe é uma avaria silenciosa — pára-se antes.
  pararDitado();
  const c = cred();
  $("#quem").innerHTML = c ? `${esc(c.utilizador || "")}<br>${esc(c.nome || "")}` : "";
  $("#cabTitulo").textContent = c ? "" : "emparelhar";
  if (!c) { $("#barra").hidden = true; return pintarEmparelhar(); }
  return vista === "fila" ? pintarFila() : pintarCamara();
}

function barraRecado() {
  if (!recado) return "";
  const h = `<div class="aviso ${recado.tipo}">${esc(recado.txt)}</div>`;
  return h;
}

/* ── Emparelhar ───────────────────────────────────────────────────────────── */
function pintarEmparelhar() {
  $("#ecra").innerHTML = `
    ${barraRecado()}
    <div class="cartao">
      <div class="eyebrow">Primeiro passo</div>
      <h2 style="font-size:22px;margin-bottom:8px;">Ligar este telemóvel</h2>
      <p style="font-size:14px;color:var(--ink-2);margin-bottom:4px;">
        No OREX do computador: <b>Admin → Aparelhos móveis</b>, regista o aparelho e aparece um QR.
        Lê-o aqui. O código serve <b>uma vez</b> e caduca em 15 minutos.
      </p>
    </div>
    <div class="cartao" id="cxLeitor">
      <button id="btLer">Ler o QR com a câmara</button>
      <video id="video" playsinline muted hidden style="margin-top:12px;"></video>
      <p style="font-size:12px;color:var(--steel);margin:10px 0 0;" id="dicaLeitor"></p>
    </div>
    <div class="cartao">
      <div class="eyebrow">Em alternativa</div>
      <label for="colado">Colar o texto do código</label>
      <textarea id="colado" placeholder='{"v":1,"url":"…"}'></textarea>
      <button class="secundario" id="btColar" style="margin-top:8px;">Emparelhar com este texto</button>
    </div>
    <div class="rodape">orexerp.pt</div>`;

  $("#btLer").onclick = abrirLeitor;
  $("#btColar").onclick = () => {
    try { emparelhar(JSON.parse($("#colado").value.trim())); }
    catch { aviso("Esse texto não é um código de emparelhamento válido.", "erro"); }
  };
}

async function abrirLeitor() {
  const dica = $("#dicaLeitor"), v = $("#video"), bt = $("#btLer");
  if (!("BarcodeDetector" in window)) {
    dica.textContent = "Este telemóvel não sabe ler códigos sozinho (acontece no iPhone). "
      + "Usa a câmara normal do telefone só para copiar o texto e cola-o em baixo.";
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    v.srcObject = stream; v.hidden = false; bt.hidden = true; await v.play();
    dica.textContent = "Aponta ao código no ecrã do computador.";
    const det = new BarcodeDetector({ formats: ["qr_code"] });
    const parar = () => { clearInterval(leitor); stream.getTracks().forEach(t => t.stop()); v.hidden = true; };
    leitor = setInterval(async () => {
      try {
        const [b] = await det.detect(v);
        if (!b) return;
        parar();
        emparelhar(JSON.parse(b.rawValue));
      } catch (e) {
        if (e instanceof SyntaxError) { parar(); aviso("Esse QR não é um código do OREX.", "erro"); }
      }
    }, 350);
  } catch {
    dica.textContent = "Não consegui abrir a câmara. Autoriza o acesso, ou cola o texto em baixo.";
  }
}

// O QR traz um bilhete, não uma credencial. Troca-se aqui, por dentro do
// HTTPS — é o passo que faz com que fotografar o código no ecrã não sirva de
// nada a ninguém. E serve uma vez só: à segunda tentativa já não existe.
async function resgatar(url, chave, codigo) {
  const r = await fetch(`${url}/rest/v1/rpc/mov_resgatar`, {
    method: "POST",
    headers: { apikey: chave, "Content-Type": "application/json" },
    body: JSON.stringify({ p_codigo: codigo }),
  });
  const d = await r.json().catch(() => null);
  if (!r.ok) throw new Error(`O OREX não respondeu ao emparelhamento (${r.status}).`);
  if (!d || !d.email) throw new Error(
    "Este código já foi usado, expirou, ou o aparelho foi revogado. Gera outro no OREX.");
  return d;
}

async function emparelhar(carga) {
  if (!carga || !carga.url || !carga.chave)
    return aviso("Esse código não é do OREX.", "erro");
  const url = String(carga.url).replace(/\/$/, "");

  aviso("A confirmar com o OREX…", "nota");
  let c;
  try {
    if (carga.codigo) {                    // desenho actual: bilhete de uso único
      const d = await resgatar(url, carga.chave, carga.codigo);
      c = { url, chave: carga.chave, email: d.email, password: d.password,
            aparelhoId: d.aparelhoId, utilizador: d.utilizador, nome: d.nome };
    } else if (carga.email && carga.password) {
      // Desenho antigo, em que a credencial vinha escrita no QR. Aceita-se para
      // não deixar de fora um OREX ainda por actualizar — mas é para desaparecer.
      c = { url, chave: carga.chave, email: carga.email, password: carga.password,
            aparelhoId: carga.aparelhoId, utilizador: carga.utilizador, nome: carga.nome };
    } else {
      return aviso("Falta informação nesse código. Gera outro no OREX.", "erro");
    }
  } catch (e) { return aviso(e.message, "erro"); }

  grav(G.cred, c);
  try {
    await autenticar();
    await buscarDestinos();
    await trocarPassword();       // o QR fica sem valor a partir daqui
    recado = null; vista = "camara"; pintar();
    aviso("Telemóvel ligado. Já podes fotografar.", "ok");
  } catch (e) {
    localStorage.removeItem(G.cred); localStorage.removeItem(G.sessao);
    aviso(e.message + " (Se o QR tiver mais de 15 minutos, já expirou — gera outro.)", "erro");
  }
}

/* ── Câmara ───────────────────────────────────────────────────────────────── */
function empresasObras() {
  const d = ler(G.destinos) || { empresas: [] };
  return d.empresas || [];
}

function pintarCamara() {
  const empresas = empresasObras();
  const u = ler(G.ultimo) || {};
  const emp = empresas.find(e => e.ownerId === u.ownerId) || empresas[0] || null;
  const obras = emp ? emp.obras : [];
  const porEnviar = filaCache.length;

  $("#cabTitulo").textContent = "";
  $("#ecra").innerHTML = `
    <div class="abas">
      <button class="on">Fotografar</button>
      <button data-v="fila">Por enviar${porEnviar ? `<span class="conta">${porEnviar}</span>` : ""}</button>
    </div>
    ${barraRecado()}
    ${!empresas.length ? `<div class="aviso nota">Ainda não tenho a lista de obras.
        Liga-te à rede e toca em actualizar.</div>` : ""}
    <div class="cartao">
      ${empresas.length > 1 ? `
      <div class="campo">
        <label for="emp">Empresa</label>
        <select id="emp">${empresas.map(e =>
          `<option value="${e.ownerId}" ${emp && e.ownerId === emp.ownerId ? "selected" : ""}>${esc(e.nome)}</option>`
        ).join("")}</select>
      </div>` : ""}
      <div class="campo">
        <label for="obra">Obra</label>
        <select id="obra">
          ${obras.length ? obras.map(o =>
            `<option value="${o.id}" ${o.id === u.obraId ? "selected" : ""}>${o.num ? o.num + " · " : ""}${esc(o.nome)}</option>`
          ).join("") : `<option value="">— sem obras activas —</option>`}
        </select>
      </div>
      <div class="campo" style="margin-bottom:0;">
        <label for="nota">Nota <span style="font-weight:400;color:var(--steel);">(opcional)</span></label>
        <div class="ditado">
          <textarea id="nota" placeholder="O que se está a ver"></textarea>
          <button type="button" id="btDitar" class="microfone" title="Ditar">🎤</button>
        </div>
        <p id="dicaDitado" style="font-size:11.5px;color:var(--steel);margin:5px 0 0;"></p>
      </div>
    </div>
    <p style="font-size:12px;color:var(--steel);text-align:center;">
      A fotografia fica guardada no telemóvel e sobe sozinha assim que houver rede.
    </p>`;

  $("#barra").hidden = false;
  $("#barra").innerHTML =
    `<button class="disparo" id="btFoto" ${obras.length ? "" : "disabled"}>📷 Fotografar</button>
     <button class="secundario" id="btPos" style="flex:0 0 auto;padding:16px 18px;"
             ${obras.length ? "" : "disabled"} title="Marcar onde estou">📍</button>`;
  $("#btFoto").onclick = () => $("#ficheiro").click();
  $("#btPos").onclick = marcarPosicao;

  document.querySelectorAll(".abas button[data-v]").forEach(b =>
    b.onclick = () => { vista = b.dataset.v; recado = null; pintar(); });

  const se = $("#emp");
  if (se) se.onchange = () => { grav(G.ultimo, { ownerId: +se.value }); pintar(); };
  $("#obra").onchange = () => grav(G.ultimo, { ownerId: emp?.ownerId, obraId: +$("#obra").value });
  ligarDitado();
}

/* ══════════════════════════════════════════════════════════════════════════
   Ditar a nota

   Numa obra escreve-se mal: luva, poeira, chuva, e um teclado de vidro. Falar
   é mais rápido e é o que se faria naturalmente. O reconhecimento é o do
   próprio telemóvel — não sai daqui para lado nenhum nosso, não custa nada, e
   não precisa de chave.

   Escreve por cima do que já lá está? Não: acrescenta ao fim. Quem ditou duas
   frases quer as duas.
   ────────────────────────────────────────────────────────────────────────── */
const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
let _ouvinte = null;
function pararDitado() { if (_ouvinte) { try { _ouvinte.stop(); } catch {} _ouvinte = null; } }

function ligarDitado() {
  const bt = $("#btDitar"), campo = $("#nota"), dica = $("#dicaDitado");
  if (!bt) return;

  if (!Reconhecimento) {
    // Acontece sobretudo no iPhone. Dizer porquê poupa quem julgaria que a app
    // está avariada — e o teclado do próprio telefone costuma ter microfone.
    bt.disabled = true; bt.style.opacity = 0.35;
    dica.textContent = "Este telemóvel não sabe ditar dentro da app. O teclado do telefone costuma ter microfone.";
    return;
  }

  const parar = () => { try { _ouvinte && _ouvinte.stop(); } catch {} };
  bt.onclick = () => {
    if (_ouvinte) { parar(); return; }
    const r = new Reconhecimento();
    r.lang = "pt-PT"; r.continuous = true; r.interimResults = true;
    const jaLa = campo.value.trim();
    let firme = "";

    r.onstart = () => { bt.classList.add("a-ouvir"); bt.textContent = "⏹"; dica.textContent = "A ouvir… toca para parar."; };
    r.onresult = (ev) => {
      let porFirmar = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) firme += t; else porFirmar += t;
      }
      // O texto provisório aparece já, para se ver que está a apanhar.
      campo.value = [jaLa, (firme + porFirmar).trim()].filter(Boolean).join(" ").replace(/\s+/g, " ");
    };
    r.onerror = (ev) => {
      dica.textContent = ev.error === "not-allowed"
        ? "Sem autorização para o microfone. Podes escrever à mão."
        : ev.error === "no-speech" ? "Não ouvi nada." : "O ditado falhou. Podes escrever à mão.";
    };
    r.onend = () => {
      _ouvinte = null; bt.classList.remove("a-ouvir"); bt.textContent = "🎤";
      if (!dica.textContent.includes("autoriza") && !dica.textContent.includes("falhou")) dica.textContent = "";
      campo.value = campo.value.trim();
    };
    _ouvinte = r;
    try { r.start(); } catch { _ouvinte = null; dica.textContent = "Não consegui começar a ouvir."; }
  };
}

$("#ficheiro").onchange = async (ev) => {
  const f = ev.target.files?.[0];
  ev.target.value = "";
  if (!f) return;
  pararDitado();   // o que estava a ser ditado fica na nota desta fotografia
  const emp = empresasObras().find(e => e.ownerId === +(($("#emp") || {}).value || (ler(G.ultimo) || {}).ownerId))
            || empresasObras()[0];
  const obraId = +($("#obra") || {}).value;
  const obra = emp?.obras.find(o => o.id === obraId);
  if (!emp || !obra) return aviso("Escolhe primeiro a obra.", "erro");
  const nota = ($("#nota") || {}).value || "";

  aviso("A preparar a fotografia…", "nota");
  try {
    const [foto, onde] = await Promise.all([encolher(f), ondeEstou()]);
    await filaGrav({
      idLocal: uuid(), ownerId: emp.ownerId, obraId: obra.id,
      obraNome: `${obra.num ? obra.num + " · " : ""}${obra.nome}`, empresaNome: emp.nome,
      nota, foto, tiradaEm: new Date().toISOString(), estado: "espera",
      ...onde,
    });
    grav(G.ultimo, { ownerId: emp.ownerId, obraId: obra.id });
    filaCache = await filaPor();
    aviso(navigator.onLine ? "Guardada. A enviar…" : "Guardada. Sobe assim que houver rede.", "ok");
    pintar();
    escoarFila();
  } catch (e) { aviso(e.message, "erro"); }
};

/* ══════════════════════════════════════════════════════════════════════════
   Marcar onde estou

   O telemóvel é, para o RTLS da obra, uma tag que anda com uma pessoa. Manda
   a posição pelo mesmo caminho da fotografia — mesma fila, mesma espera pela
   rede — só que sem imagem. Quem converte para o referencial do modelo é o
   OREX, que é quem sabe onde fica a origem da obra.

   Aqui exige-se pontaria: uma posição com 60 m de erro não diz nada a quem
   quer saber em que piso se está. Abaixo de 30 m aceita-se, acima pergunta-se.
   ────────────────────────────────────────────────────────────────────────── */
const PRECISAO_BOA = 30;   // metros

async function marcarPosicao() {
  const emp = empresasObras().find(e => e.ownerId === +(($("#emp") || {}).value || (ler(G.ultimo) || {}).ownerId))
            || empresasObras()[0];
  const obra = emp?.obras.find(o => o.id === +($("#obra") || {}).value);
  if (!emp || !obra) return aviso("Escolhe primeiro a obra.", "erro");

  aviso("A apurar a posição…", "nota");
  const onde = await ondeEstou(15000);
  if (onde.lat == null) return aviso("Não consegui obter a posição. Autoriza a localização e tenta ao ar livre.", "erro");

  if (onde.precisao > PRECISAO_BOA &&
      !confirm(`A posição só tem ${Math.round(onde.precisao)} m de precisão — dentro de um edifício é normal.\n\n`
             + "Marcar assim mesmo?")) return aviso(null, "nota");

  const nota = ($("#nota") || {}).value || "";
  await filaGrav({
    idLocal: uuid(), tipo: "posicao", ownerId: emp.ownerId, obraId: obra.id,
    obraNome: `${obra.num ? obra.num + " · " : ""}${obra.nome}`, empresaNome: emp.nome,
    nota, tiradaEm: new Date().toISOString(), estado: "espera", ...onde,
  });
  filaCache = await filaPor();
  aviso(`Posição marcada (±${Math.round(onde.precisao)} m). ` +
        (navigator.onLine ? "A enviar…" : "Sobe assim que houver rede."), "ok");
  pintar();
  escoarFila();
}

/* ── Fila ─────────────────────────────────────────────────────────────────── */
function pintarFila() {
  const rot = { espera: "em espera", enviando: "a enviar", falhou: "falhou" };
  $("#ecra").innerHTML = `
    <div class="abas">
      <button data-v="camara">Fotografar</button>
      <button class="on">Por enviar${filaCache.length ? `<span class="conta">${filaCache.length}</span>` : ""}</button>
    </div>
    ${barraRecado()}
    <div class="cartao">
      ${filaCache.length ? filaCache
        .sort((a, b) => b.tiradaEm.localeCompare(a.tiradaEm))
        .map(it => `
        <div class="item">
          ${it.tipo === "posicao"
            ? `<div style="width:52px;height:52px;flex:none;border-radius:6px;background:var(--line-2);
                    display:flex;align-items:center;justify-content:center;font-size:22px;">📍</div>`
            : `<img src="${miniatura(it)}" alt="" />`}
          <div class="txt">
            <b>${esc(it.obraNome)}</b>
            <small>${esc(it.empresaNome)} · ${new Date(it.tiradaEm).toLocaleString("pt-PT",
              { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</small>
            ${it.erro ? `<small style="color:var(--erro);display:block;">${esc(it.erro)}</small>` : ""}
          </div>
          <span class="estado ${it.estado === "falhou" ? "falhou" : it.estado === "enviando" ? "envio" : "espera"}">
            ${rot[it.estado] || it.estado}</span>
          <button class="perigo pequeno" data-apaga="${it.idLocal}"
                  style="flex:none;padding:6px 9px;">✕</button>
        </div>`).join("")
        : `<div class="vazio">Nada por enviar.<br>Tudo o que fotografaste já chegou ao OREX.</div>`}
    </div>
    <div class="cartao">
      <div class="eyebrow">Este aparelho</div>
      <p style="font-size:13px;color:var(--ink-2);margin-bottom:10px;">
        ${esc((cred() || {}).nome || "")} · ${esc((cred() || {}).utilizador || "")}<br>
        <span class="mono" style="font-size:11px;color:var(--steel);">
          ${empresasObras().length} empresa(s) ·
          ${empresasObras().reduce((n, e) => n + e.obras.length, 0)} obra(s)
        </span>
      </p>
      <div class="linha">
        <button class="secundario" id="btActualiza">Actualizar obras</button>
        <button class="secundario" id="btEnvia">Tentar agora</button>
      </div>
      <button class="perigo" id="btDesliga" style="margin-top:8px;">Desligar este telemóvel</button>
    </div>
    <div class="rodape">orexerp.pt</div>`;

  $("#barra").hidden = true;
  document.querySelectorAll(".abas button[data-v]").forEach(b =>
    b.onclick = () => { vista = b.dataset.v; recado = null; pintar(); });

  document.querySelectorAll("[data-apaga]").forEach(b => b.onclick = async () => {
    if (!confirm("Apagar esta fotografia sem a enviar?")) return;
    await filaTira(b.dataset.apaga); esquecerMiniatura(b.dataset.apaga);
    filaCache = await filaPor(); pintar();
  });

  $("#btActualiza").onclick = async () => {
    aviso("A actualizar…", "nota");
    try { await buscarDestinos(); recado = null; aviso("Lista de obras actualizada.", "ok"); }
    catch (e) { aviso(e.message, "erro"); }
  };
  $("#btEnvia").onclick = async () => {
    if (!navigator.onLine) return aviso("Sem rede. Fica na fila.", "nota");
    aviso("A enviar…", "nota");
    for (const it of await filaPor()) { delete it.proxima; await filaGrav(it); }
    await escoarFila(true);
    filaCache = await filaPor();
    aviso(filaCache.length ? "Ainda ficaram algumas por enviar." : "Está tudo enviado.",
          filaCache.length ? "nota" : "ok");
  };
  $("#btDesliga").onclick = async () => {
    const n = (await filaPor()).length;
    if (!confirm(`Desligar este telemóvel do OREX?\n\n${n ? `Há ${n} fotografia(s) por enviar que se perdem.\n\n` : ""}`
      + "Para voltar a usar precisas de um QR novo.")) return;
    localStorage.removeItem(G.cred); localStorage.removeItem(G.sessao); localStorage.removeItem(G.destinos);
    await trans("readwrite", s => s.clear());
    for (const id of [..._miniaturas.keys()]) esquecerMiniatura(id);
    filaCache = []; recado = null; vista = "camara"; pintar();
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   Arranque
   ────────────────────────────────────────────────────────────────────────── */
(async function () {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  filaCache = await filaPor().catch(() => []);
  pintar();

  if (cred()) {
    // A app abre com o que já sabe; o que vier da rede corrige-a a seguir.
    escoarFila();
    trocarPassword().catch(() => {});
    buscarDestinos().then(() => pintar()).catch(e => {
      if (!ler(G.destinos)) aviso(e.message, "erro");
    });
  }

  window.addEventListener("online", () => escoarFila());
  document.addEventListener("visibilitychange", () => { if (!document.hidden) escoarFila(); });
  setInterval(() => { if (filaCache.length) escoarFila(); }, 60000);
})();
