<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OREX — ligar o telemóvel</title>
<meta name="description" content="Ligar este telemóvel ao OREX e escolher o que fazer." />
<meta name="theme-color" content="#0F0F0D" />
<meta name="apple-mobile-web-app-title" content="OREX" />
<link rel="icon" href="icone-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" />
<link rel="stylesheet" href="comum.css" />

<!--
  /app — a porta de entrada.

  Esta página NÃO é instalável, de propósito. É onde se lê o QR uma vez e
  onde se escolhe para onde ir. Instaláveis são as três de trabalho, e cada
  pessoa instala as que usa: quem só fotografa não quer mais três ícones no
  telemóvel.

  Emparelhar aqui chega para todas, porque localStorage e IndexedDB são
  partilhados por ORIGEM e não por caminho.
-->

<header>
  <div class="marca">OREX</div>
  <div class="quem" id="quem"></div>
</header>

<main id="ecra"></main>

<script src="orex.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
let recado = null, leitor = null;
function aviso(txt, tipo = "nota") { recado = txt ? { txt, tipo } : null; pintar(); }
const barraRecado = () => recado ? `<div class="aviso ${recado.tipo}">${esc(recado.txt)}</div>` : "";

const PORTAS = [
  { href: "../fotografias/", ic: "📷", nome: "Fotografias", desc: "Fotografar a obra e enviar" },
  { href: "../rtls/",        ic: "📍", nome: "Localização", desc: "Marcar onde estou" },
  { href: "../agenda/",      ic: "🗓", nome: "Agenda",      desc: "O que aconteceu e o que está marcado" },
];

function pintar() {
  const c = OREX.cred();
  $("#quem").innerHTML = c ? `${esc(c.utilizador || "")}<br>${esc(c.nome || "")}` : "";
  return c ? pintarIndice(c) : pintarEmparelhar();
}

/* ── Índice: já emparelhado ────────────────────────────────────────────────── */
function pintarIndice(c) {
  const emp = OREX.empresas();
  $("#ecra").innerHTML = `
    ${barraRecado()}
    <div class="cartao">
      <div class="eyebrow">Este telemóvel</div>
      <div style="font-size:15px;font-weight:700;">${esc(c.nome || "")}</div>
      <div style="font-size:12.5px;color:var(--steel);margin-top:2px;">
        ${esc(c.utilizador || "")} · ${emp.length} empresa(s) ·
        ${emp.reduce((n, e) => n + e.obras.length, 0)} obra(s)
      </div>
    </div>

    <div class="eyebrow">O que queres fazer</div>
    <div class="portas">
      ${PORTAS.map(p => `<a class="porta" href="${p.href}">
        <span class="ic">${p.ic}</span><b>${p.nome}</b><small>${p.desc}</small></a>`).join("")}
    </div>

    <p style="font-size:12px;color:var(--steel);margin:14px 0 0;line-height:1.6;">
      Cada uma destas pode ser <b>adicionada ao ecrã principal</b> como aplicação própria —
      instala só as que usares. Esta página é só para ligar o telemóvel.
    </p>

    <div class="cartao" style="margin-top:14px;">
      <div class="linha">
        <button class="secundario" id="btActualiza">Actualizar obras</button>
        <button class="perigo" id="btDesliga">Desligar</button>
      </div>
    </div>
    <div class="rodape">orexerp.pt</div>`;

  $("#btActualiza").onclick = async () => {
    aviso("A actualizar…", "nota");
    try { await OREX.buscarDestinos(); aviso("Lista de obras actualizada.", "ok"); }
    catch (e) { aviso(e.message, "erro"); }
  };
  $("#btDesliga").onclick = async () => {
    const n = (await OREX.fila()).length;
    if (!confirm(`Desligar este telemóvel do OREX?\n\n${n ? `Há ${n} envio(s) por fazer que se perdem.\n\n` : ""}`
      + "Para voltar a usar precisas de um QR novo.")) return;
    OREX.esquecerTudo(); await OREX.limparFila(); recado = null; pintar();
  };
}

/* ── Emparelhar ───────────────────────────────────────────────────────────── */
function pintarEmparelhar() {
  $("#ecra").innerHTML = `
    ${barraRecado()}
    <div class="cartao">
      <div class="eyebrow">Primeiro passo</div>
      <h2 style="font-size:22px;margin-bottom:8px;">Ligar este telemóvel</h2>
      <p style="font-size:14px;color:var(--ink-2);margin-bottom:4px;">
        No OREX do computador: <b>Admin → Aparelhos móveis</b>, regista o aparelho e aparece um QR.
        Lê-o aqui. O código serve <b>uma vez</b> e caduca em 15 minutos.
      </p>
    </div>
    <div class="cartao">
      <button id="btLer">Ler o QR com a câmara</button>
      <video id="video" playsinline muted hidden style="width:100%;border-radius:10px;background:#000;aspect-ratio:3/4;object-fit:cover;margin-top:12px;"></video>
      <p style="font-size:12px;color:var(--steel);margin:10px 0 0;" id="dicaLeitor"></p>
    </div>
    <div class="cartao">
      <div class="eyebrow">Em alternativa</div>
      <label for="colado">Colar o texto do código</label>
      <textarea id="colado" placeholder='{"v":2,"url":"…"}'></textarea>
      <button class="secundario" id="btColar" style="margin-top:8px;">Emparelhar com este texto</button>
    </div>
    <div class="rodape">orexerp.pt</div>`;

  $("#btLer").onclick = abrirLeitor;
  $("#btColar").onclick = () => {
    try { emparelhar(JSON.parse($("#colado").value.trim())); }
    catch { aviso("Esse texto não é um código de emparelhamento válido.", "erro"); }
  };
}

async function abrirLeitor() {
  const dica = $("#dicaLeitor"), v = $("#video"), bt = $("#btLer");
  if (!("BarcodeDetector" in window)) {
    dica.textContent = "Este telemóvel não sabe ler códigos sozinho (acontece no iPhone). "
      + "Usa a câmara normal do telefone só para copiar o texto e cola-o em baixo.";
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    v.srcObject = stream; v.hidden = false; bt.hidden = true; await v.play();
    dica.textContent = "Aponta ao código no ecrã do computador.";
    const det = new BarcodeDetector({ formats: ["qr_code"] });
    const parar = () => { clearInterval(leitor); stream.getTracks().forEach(t => t.stop()); v.hidden = true; };
    leitor = setInterval(async () => {
      try {
        const [b] = await det.detect(v);
        if (!b) return;
        parar();
        emparelhar(JSON.parse(b.rawValue));
      } catch (e) {
        if (e instanceof SyntaxError) { parar(); aviso("Esse QR não é um código do OREX.", "erro"); }
      }
    }, 350);
  } catch {
    dica.textContent = "Não consegui abrir a câmara. Autoriza o acesso, ou cola o texto em baixo.";
  }
}

async function emparelhar(carga) {
  if (!carga || !carga.url || !carga.chave) return aviso("Esse código não é do OREX.", "erro");
  const url = String(carga.url).replace(/\/$/, "");
  aviso("A confirmar com o OREX…", "nota");
  let c;
  try {
    if (carga.codigo) {
      const d = await OREX.resgatar(url, carga.chave, carga.codigo);
      c = { url, chave: carga.chave, email: d.email, password: d.password,
            aparelhoId: d.aparelhoId, utilizador: d.utilizador, nome: d.nome };
    } else if (carga.email && carga.password) {
      // Desenho antigo, em que a credencial vinha escrita no QR. Aceita-se para
      // não deixar de fora um OREX ainda por actualizar — mas é para desaparecer.
      c = { url, chave: carga.chave, email: carga.email, password: carga.password,
            aparelhoId: carga.aparelhoId, utilizador: carga.utilizador, nome: carga.nome };
    } else return aviso("Falta informação nesse código. Gera outro no OREX.", "erro");
  } catch (e) { return aviso(e.message, "erro"); }

  OREX.guardarCred(c);
  try {
    await OREX.autenticar();
    await OREX.buscarDestinos();
    await OREX.trocarPassword();      // o QR fica sem valor a partir daqui
    recado = null; pintar();
    aviso("Telemóvel ligado. Escolhe o que queres fazer.", "ok");
  } catch (e) {
    OREX.esquecerTudo();
    aviso(e.message + " (Se o QR tiver mais de 15 minutos, já expirou — gera outro.)", "erro");
  }
}

/* ── Arranque ─────────────────────────────────────────────────────────────── */
OREX.aoMudar((que, d) => { if (que === "revogado") { recado = null; pintar(); aviso(d.porque, "erro"); } });
pintar();
if (OREX.cred()) {
  OREX.trocarPassword().catch(() => {});
  OREX.buscarDestinos().then(() => pintar()).catch(() => {});
}
</script>
